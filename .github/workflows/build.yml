name: Build Immersive Outfit Distribution

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  # vcpkg version: the baseline CommonLibSSE-NG v12.1.0 builds with (see vcpkg.json)
  VCPKG_COMMIT: ee12231b20c95013c6638d845d04c91559a1d1ff
  # Papyrus toolchain (same as the SOES build): Caprica compiler and public script headers
  CAPRICA_COMMIT: 9cd6d32ec2750adae329e81f7276dac95251e000
  NL_ONLINE_COMMIT: 579cec203d4dcd093f6f01a6cb1d0851a5194a9a

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 150

    steps:
      - name: Check out (with CommonLibSSE-NG submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Set up MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4.0.0
        with:
          arch: x64

      - name: Pin vcpkg cache directories
        shell: bash
        run: |
          echo "VCPKG_DOWNLOADS=${{ github.workspace }}/vcpkg_downloads" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=${{ github.workspace }}/vcpkg_binary_cache" >> "$GITHUB_ENV"
          mkdir -p "${{ github.workspace }}/vcpkg_downloads" "${{ github.workspace }}/vcpkg_binary_cache"

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg_downloads
            ${{ github.workspace }}/vcpkg_binary_cache
          key: vcpkg-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ env.VCPKG_COMMIT }}-

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          runVcpkgInstall: false

      - name: Configure (installs dependencies; retried for flaky downloads)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_wait_seconds: 30
          shell: pwsh
          command: |
            # Build CommonLib from source with the same dependency versions as the plugin.
            Remove-Item Env:GITHUB_ACTIONS -ErrorAction SilentlyContinue
            cmake --preset release-msvc -DCOMMONLIB_ENABLE_IPO=OFF -DBUILD_TESTS=OFF

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:GITHUB_ACTIONS -ErrorAction SilentlyContinue
          cmake --build --preset release-msvc
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

      # ---------------------------------------------------------------------------------------
      # MCM: Papyrus scripts compiled with Caprica (open-source) against public headers (vanilla,
      # SKSE, SkyUI), and a small ESL plugin generated by tools/make_esp.py. No Creation Kit.
      # ---------------------------------------------------------------------------------------
      - name: Cache Caprica
        id: caprica-cache
        uses: actions/cache@v4
        with:
          path: caprica-bin
          key: caprica-${{ env.CAPRICA_COMMIT }}-${{ hashFiles('papyrus/caprica-skyrim-native.patch') }}

      - name: Build Caprica (Papyrus compiler)
        if: steps.caprica-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git -c core.autocrlf=false clone https://github.com/nikitalita/Caprica.git caprica
          git -c core.autocrlf=false -C caprica checkout $env:CAPRICA_COMMIT
          # Skyrim allows global Native functions in scripts not marked Native (SKSE relies on it).
          git -C caprica apply --verbose ../papyrus/caprica-skyrim-native.patch
          if ($LASTEXITCODE -ne 0) { throw "Caprica patch failed" }
          # Caprica pins an old vcpkg baseline whose Boost no longer builds with current MSVC.
          $manifest = Get-Content caprica/vcpkg.json -Raw | ConvertFrom-Json
          $manifest.'builtin-baseline' = $env:VCPKG_COMMIT
          $manifest | ConvertTo-Json -Depth 10 | Set-Content caprica/vcpkg.json -Encoding utf8
          cmake -S caprica -B caprica/build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-release `
            -DVCPKG_HOST_TRIPLET=x64-windows-static-release `
            -DCAPRICA_USE_STATIC_RUNTIME=ON
          if ($LASTEXITCODE -ne 0) { throw "Caprica configure failed" }
          cmake --build caprica/build
          if ($LASTEXITCODE -ne 0) { throw "Caprica build failed" }
          $exe = Get-ChildItem -Recurse -Path caprica/build -Filter Caprica.exe | Select-Object -First 1
          if (-not $exe) { throw "Caprica.exe not found" }
          New-Item -ItemType Directory -Force -Path caprica-bin | Out-Null
          Copy-Item $exe.FullName caprica-bin/

      - name: Compile Papyrus scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --filter=blob:none --sparse https://github.com/MrOctopus/nl_online.git nl_online
          git -C nl_online checkout $env:NL_ONLINE_COMMIT
          git -C nl_online sparse-checkout set sse/source skse64/source skyui/source
          # One header folder (Caprica rejects duplicate names across folders); SKSE's win.
          $h = New-Item -ItemType Directory -Force -Path papyrus-headers
          Copy-Item nl_online/sse/source/* $h -Force
          Copy-Item nl_online/skse64/source/* $h -Force
          Copy-Item nl_online/skyui/source/*.psc $h -Force
          $out = New-Item -ItemType Directory -Force -Path package/Scripts
          $flags = (Resolve-Path papyrus-headers/TESV_Papyrus_Flags.flg).Path
          & caprica-bin/Caprica.exe --game skyrim -f $flags -i $h.FullName `
            -o $out.FullName --release --final papyrus/IOD_Native.psc papyrus/IOD_MCM.psc
          if ($LASTEXITCODE -ne 0) { throw "Papyrus compile failed" }
          $src = New-Item -ItemType Directory -Force -Path package/Scripts/Source
          Copy-Item papyrus/*.psc $src
          Get-ChildItem -Recurse package/Scripts | ForEach-Object { "$($_.Name)  $($_.Length) bytes" }

      - name: Generate the plugin (ESL)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/make_esp.py package/ImmersiveOutfitDistribution.esp
          if ($LASTEXITCODE -ne 0) { throw "Plugin generation failed" }
          "$((Get-Item package/ImmersiveOutfitDistribution.esp).Length) bytes"

      - name: Package as a mod
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $plugins = New-Item -ItemType Directory -Force -Path package/SKSE/Plugins
          $dll = Get-ChildItem -Recurse -Path build/release-msvc -Filter ImmersiveOutfitDistribution.dll | Select-Object -First 1
          if (-not $dll) { throw "DLL not found" }
          Copy-Item $dll.FullName $plugins
          $pdb = Get-ChildItem -Recurse -Path build/release-msvc -Filter ImmersiveOutfitDistribution.pdb | Select-Object -First 1
          if ($pdb) { Copy-Item $pdb.FullName $plugins }
          # The set list is the user's own file: updates never ship one, so installing (Merge in
          # MO2) only replaces the plugin. The example stays in the repo (config/MyOutfits.json).
          Copy-Item README.md package/README-ImmersiveOutfitDistribution.md
          Get-ChildItem -Recurse package | ForEach-Object { $_.FullName }

      - name: Upload mod package
        uses: actions/upload-artifact@v4
        with:
          name: ImmersiveOutfitDistribution
          path: package/
          if-no-files-found: error
